# Configuración nginx del sitio de producción (VPS 192.168.1.250).
# Ruta en el VPS: /etc/nginx/sites-enabled/misfinanzas
#
# Topología real:
#   borde: lighttpd (FreeBSD 207.248.113.8) termina TLS en 10.10.10.1:443
#          y reenvía al nginx interno (este archivo).
#   interno: nginx :80 sirve /var/www/misfinanzas y proxya /api/ a server.mjs.
#
# W20 — PDF worker: pdfjs-dist (v6) carga el worker como módulo ES dinámico y el
# navegador exige MIME application/javascript. Sin este bloque, nginx sirve .mjs
# como application/octet-stream y el import() del worker falla con
# "Failed to fetch dynamically imported module".
server {
    listen 80 default_server;
    server_name _;
    root /var/www/misfinanzas;
    index index.html;

    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}